[package]
edition = "2021"
name = "veilid-taxi"
version = "0.0.1"
license = "MIT OR Apache-2.0"
description = "Decentralized Taxi over Veilid Network"
keywords = ["veilid", "news",]
repository = "https://github.com/stillonearth/veilid-taxi"
rust-version = "1.83.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
veilid-core = {version="0.5.7", default-features = false, features=["default-async-std"]}

[dependencies]
anyhow = "1.0"
async-std ="1.13"
axum = { version = "0.8", features = ["ws"]  }
axum-extra = { version = "0.12", features = [ "typed-header" ] }
blake3 = "1.8.7"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
ed25519-dalek = "3.0"
flume = "0.12"
h3o = "0.11.0"
rand ="0.10"
reqwest = "0.13"
rng = "0.1"
serde = { version = "1.0", features= ["derive"] }
serde_json = "1.0"
sha_256 = "1.0"
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "trace"] }
tracing = "0.1.44"
ferroui = "0.4.0-preview.1"
ferroui-base = "=0.4.0-preview.1"
ferroui-controls = "=0.4.0-preview.1"
ferroui-desktop = "=0.4.0-preview.1"
ferroui-themes-fluent = "=0.4.0-preview.1"

[profile.test]
opt-level = 2
