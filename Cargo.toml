[package]
edition = "2021"
name = "veilid-taxi"
version = "0.0.1"
license = "MIT OR Apache-2.0"
description = "Decentralized Taxi over Veilid Network"
keywords = ["veilid", "news",]
repository = "https://github.com/stillonearth/veilid-taxi"
rust-version = "1.83.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
veilid-core = {version="0.5.7", default-features = false, features=["default-async-std"]}


[dependencies]
anyhow = "1.0"
async-std ="1.13"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
rand ="0.10"
reqwest = "0.13"
serde = { version = "1.0", features= ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1.44"
blake3 = "1.8.7"
ed25519-dalek = "3.0"
h3o = "0.11.0"
rng = "0.1"
axum = "0.8"

[profile.test]
opt-level = 2
